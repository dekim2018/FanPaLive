server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: interaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${INTERACTION_DB_NAME:interaction_db}
    username: ${DB_USERNAME:livebroadcast}
    password: ${DB_PASSWORD:livebroadcast}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    async:
      request-timeout: -1

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health}

services:
  broadcast-url: ${BROADCAST_SERVICE_URL:http://localhost:8082}
  fandom-url: ${FANDOM_SERVICE_URL:http://localhost:8084}

app:
  streams:
    donations: fanpa:stream:donations
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    issuer: live-broadcast
  internal:
    api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
  payment:
    # 토스페이먼츠 개발자센터에서 발급받은 "테스트" 키를 환경변수로 넣는다.
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    api-url: ${TOSS_API_URL:https://api.tosspayments.com}
    min-amount: 1000
    max-amount: 1000000

# ErrDeck(같은 사람이 만든 모니터링 서비스) 연결. -Perrdeck=true 로 빌드하고 ERRDECK_DSN 을 줄 때만 켜진다(docs/ERRDECK.md).
# 지표는 MANAGEMENT_EXPOSURE=health,prometheus 로 띄우면 /actuator/prometheus 에 나온다. 요청 시간은 p95 를 계산하게 히스토그램으로.
errdeck:
  dsn: ${ERRDECK_DSN:}
  environment: ${APP_ENVIRONMENT:local}
  release: ${APP_RELEASE:local}
  in-app-packages: com.livebroadcast
  redact-paths:
    - (Bearer\s+)[A-Za-z0-9._~+/=-]+
  tracing:
    sample-rate: ${ERRDECK_TRACE_SAMPLE_RATE:0.1}

