server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: broadcast-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${BROADCAST_DB_NAME:broadcast_db}
    username: ${DB_USERNAME:livebroadcast}
    password: ${DB_PASSWORD:livebroadcast}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health}

services:
  fandom-url: ${FANDOM_SERVICE_URL:http://localhost:8084}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    issuer: live-broadcast
  internal:
    api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
  media:
    api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
    playback-url: ${MEDIAMTX_PLAYBACK_URL:http://localhost:9996}
    public-media-base: /media
    public-playback-base: /playback
    recording-root: /recordings
    stale-grace: ${STREAM_STALE_GRACE:3m}
    stale-check-interval: 60s

# ErrDeck(같은 사람이 만든 모니터링 서비스) 연결. -Perrdeck=true 로 빌드하고 ERRDECK_DSN 을 줄 때만 켜진다(docs/ERRDECK.md).
# 지표는 MANAGEMENT_EXPOSURE=health,prometheus 로 띄우면 /actuator/prometheus 에 나온다. 요청 시간은 p95 를 계산하게 히스토그램으로.
errdeck:
  dsn: ${ERRDECK_DSN:}
  environment: ${APP_ENVIRONMENT:local}
  release: ${APP_RELEASE:local}
  in-app-packages: com.livebroadcast
  redact-paths:
    - (Bearer\s+)[A-Za-z0-9._~+/=-]+
  tracing:
    sample-rate: ${ERRDECK_TRACE_SAMPLE_RATE:0.1}

