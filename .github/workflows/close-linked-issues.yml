# GitHub 는 기본 브랜치(main)로 머지될 때만 PR 본문의 "Closes #N" 으로 이슈를 닫는다.
# develop 으로 머지되는 PR 도 같은 키워드로 연결된 이슈를 닫도록 한다.
name: Close linked issues

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced with closing keywords
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issues=$(printf '%s' "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)
          for n in $issues; do
            gh issue close "$n" --reason completed --comment "#$PR_NUMBER 이 develop 에 머지되어 닫습니다."
          done
