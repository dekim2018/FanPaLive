plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    springCloudVersion = '2025.1.3'
}

subprojects {
    group = 'com.livebroadcast'
    version = '1.0.0'

    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// 서비스(공통 모듈 제외)의 지표를 Prometheus 형식으로도 낸다. 노출은 MANAGEMENT_EXPOSURE 로 켠다.
// ErrDeck SDK 는 공개 저장소에 없으므로 -Perrdeck=true 일 때만 로컬 메이븐에서 넣는다(docs/ERRDECK.md).
configure(subprojects.findAll { it.name != 'common' }) {
    dependencies {
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    }
    if (findProperty('errdeck') == 'true') {
        repositories {
            mavenLocal()
        }
        dependencies {
            implementation 'com.errdeck:errdeck-sdk-spring:0.1.0-SNAPSHOT'
        }
    }
}

